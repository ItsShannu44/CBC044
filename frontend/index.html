<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0a3034" />
    <meta name="description" content="VidyaSutra checks your profile against every scholarship and shows which ones you qualify for, and why." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>VidyaSutra · Scholarship eligibility and applications</title>
  </head>
  <body>
    <div id="root">
      <!-- Shown until React takes over: the logo thread draws itself. -->
      <style>
        .sp{min-height:100vh;display:grid;place-items:center;background:#eef5f3;font-family:Poppins,system-ui,sans-serif}
        .sp-in{display:flex;flex-direction:column;align-items:center;gap:18px}
        .sp-draw{stroke-dasharray:100 100;animation:spd 1.8s cubic-bezier(.65,0,.35,1) infinite}
        @keyframes spd{0%{stroke-dashoffset:100}55%{stroke-dashoffset:0}100%{stroke-dashoffset:-100}}
        .sp-name{font-weight:800;font-size:24px;color:#0f2a2c;letter-spacing:-.02em}.sp-name b{color:#8a5a00}
      </style>
      <div class="sp" role="status"><div class="sp-in">
        <svg viewBox="0 0 48 48" width="80" height="80" aria-hidden="true">
  <defs>
    <linearGradient id="st" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#17897e"/><stop offset="1" stop-color="#0a3034"/></linearGradient>
    <linearGradient id="sg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f8dc98"/><stop offset="1" stop-color="#d9982a"/></linearGradient>
  </defs>
  <rect width="48" height="48" rx="13" fill="url(#st)"/>
  <rect x=".75" y=".75" width="46.5" height="46.5" rx="12.3" fill="none" stroke="#fff" stroke-opacity=".14" stroke-width="1.5"/>
  <path d="M6.5 32.6c5.6-2.5 11.4-2.3 17.5 1v7c-6.1-3.3-11.9-3.5-17.5-1Z" fill="#f6eedb"/>
  <path d="M41.5 32.6c-5.6-2.5-11.4-2.3-17.5 1v7c6.1-3.3 11.9-3.5 17.5-1Z" fill="#dcefea"/>
  <path d="M30.6 11.2C28.2 7.9 17.6 7.8 17.6 13.9 17.6 20.2 30.4 19.1 30.4 25.6 30.4 29.4 26.6 31.7 24 33.4" fill="none" stroke="url(#sg)" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round" pathLength="100" class="sp-draw"/>
  <circle cx="31.4" cy="11.6" r="3.3" fill="#f8dc98"/>
</svg>

        <div class="sp-name">Vidya<b>Sutra</b></div>
      </div></div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
